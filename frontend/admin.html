<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>DataKite AI — Owner Analytics</title><link rel="stylesheet" href="/style.css"><style>
body{background:#07080b;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:22px;font-weight:800}.muted{color:#9aa0aa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#101216;border:1px solid #252830;border-radius:16px;padding:20px}.num{font-size:32px;font-weight:800;margin-top:8px}.section{margin-top:24px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:160px 1fr 70px;gap:12px;padding:12px;border-bottom:1px solid #24262d}.activity{display:grid;grid-template-columns:170px 100px 1fr 150px;gap:10px;padding:12px;border-bottom:1px solid #24262d;font-size:14px}.pill{display:inline-block;border:1px solid #343740;border-radius:999px;padding:4px 8px}.back{color:#ff8a00;text-decoration:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.activity{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 50px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">✦ DataKite AI Owner Analytics</div><div class="muted">Private usage dashboard for the owner</div></div><a class="back" href="/app">← Back to app</a></div>
<div id="status" class="muted">Loading usage data…</div><div class="grid section" id="cards"></div><div class="section card"><h2>Popular AI questions</h2><div id="questions" class="list"></div></div><div class="section card"><h2>Recent user activity</h2><div id="activity"></div></div></div>
<script>
async function load(){const r=await fetch('/admin/usage/summary');let j={};try{j=await r.json()}catch{}if(!r.ok){document.getElementById('status').textContent=j.error||'Owner analytics unavailable.';return}const u=j.usage||{};document.getElementById('status').textContent=`Last ${u.days||30} days · ${u.configured?'Supabase connected':'Supabase not configured'}`;const cards=[['Users',u.total_users],['Active today',u.active_today],['AI questions',u.ai_questions],['Uploads',u.uploads],['Exports',u.exports],['Logins',u.logins],['Events',u.total_events],['Errors',u.errors]];document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]??0}</div></div>`).join('');document.getElementById('questions').innerHTML=(u.popular_questions||[]).map(x=>`<div class="row"><div>${escapeHtml(x.question)}</div><div></div><strong>${x.count}</strong></div>`).join('')||'<div class="muted">No questions yet.</div>';document.getElementById('activity').innerHTML=(u.recent_activity||[]).map(x=>`<div class="activity"><span>${escapeHtml(x.time||'')}</span><span class="pill">${escapeHtml(x.event||'')}</span><span>${escapeHtml(x.question||'')}</span><span>${escapeHtml(x.user||'')}</span></div>`).join('')||'<div class="muted">No activity yet.</div>'}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();setInterval(load,30000);
</script></body></html>
